services:
  juiceshop:
    image: bkimminich/juice-shop
    container_name: juiceshop
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: rev_proxy
    restart: unless-stopped
    networks:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx

networks:
  backend:
    internal: true
  frontend:

volumes:
  nginx_logs:
